appId: com.garam.g-recorder
productName: G-Recorder

directories:
  output: release
  buildResources: resources

files:
  - out/**/*

# koffi ships its binary as @koromix/koffi-win32-x64/**/koffi.node, and a .node
# file cannot be loaded from inside app.asar — it packs happily and then the
# controller shortcuts are dead on every installed copy.
asarUnpack:
  - "**/*.node"
  - "**/@koromix/**"

extraResources:
  # FFmpeg is optional at package time — the app downloads it on first run when
  # this folder is empty, which keeps the installer small.
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - "**/*"
      - "!.gitkeep"
  # Tray and window icons are loaded from disk at runtime.
  - from: resources/icons
    to: icons
    filter:
      - "**/*.png"
      - "**/*.ico"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: G-Recorder
  # The finish-page launch is off because build/installer.nsh starts the app
  # itself. That checkbox does not exist in a silent install, which is how
  # Garam Setup installs, and the app's first run is what registers
  # launch-at-startup and starts the replay buffer.
  runAfterFinish: false
  include: build/installer.nsh
