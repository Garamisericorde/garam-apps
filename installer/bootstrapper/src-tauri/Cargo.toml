[package]
name = "garam-setup"
version = "0.1.0"
description = "Small downloader-style installer for the Garam apps"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than native-tls: HTTPS without depending on a system OpenSSL,
# which is what keeps this shippable as a single file.
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Everything here is about size: optimise for it, link-time optimise, drop the
# panic unwinder and the symbols.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
