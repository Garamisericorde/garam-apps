name: Build Garam Setup
on:
  push:
    branches: [codex/setup-release]
    paths: ['installer/bootstrapper/**', '.github/workflows/build-setup.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer/bootstrapper/src-tauri
      - name: Install UI dependencies
        working-directory: installer/bootstrapper
        run: npm ci
      - name: Build UI
        working-directory: installer/bootstrapper
        run: npm run ui:build
      - name: Test install results and retry UI
        working-directory: installer/bootstrapper
        run: npm test
      - name: Test installer validation
        working-directory: installer/bootstrapper/src-tauri
        run: cargo test
      - name: Build standalone setup
        working-directory: installer/bootstrapper
        run: npx tauri build --bundles none
      - name: Publish setup EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'installer/bootstrapper/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).package.version
          $tag = "setup-v$version"
          $asset = "Garam-Setup-$version.exe"
          $binary = 'installer/bootstrapper/src-tauri/target/release/Garam Setup.exe'
          if (!(Test-Path $binary)) { $binary = 'installer/bootstrapper/src-tauri/target/release/garam-setup.exe' }
          Copy-Item -LiteralPath $binary -Destination $asset

          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets,isDraft
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Garam Setup $version" --latest --notes 'Installs selected Windows apps from the live catalog and preserves existing G-DPI service profiles.'
            if ($LASTEXITCODE -ne 0) { throw 'Setup release creation failed' }
            return
          }

          $release = $releaseJson | ConvertFrom-Json
          if ($asset -notin $release.assets.name) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Setup upload failed' }
          }
          if ($release.isDraft) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Setup release publication failed' }
          }
